[tool.poetry]
name = "fiddle-auth"
version = "0.1.0"
description = "Simple Flask-based auth API with MongoDB and JWT support."
authors = ["Your Name <you@example.com>"]
readme = "README.md"
packages = [{ include = "auth" }]

[tool.poetry.dependencies]
python = "^3.10"
Flask = "^3.0.2"
pymongo = "^4.6.1"
bcrypt = "^4.1.2"
PyJWT = "^2.8.0"

[tool.poetry.scripts]
auth-server = "server:main"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"
